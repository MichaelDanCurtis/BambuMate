[package]
name = "bambumate-tauri"
version = "0.1.0"
edition = "2021"
description = "BambuMate Tauri backend"
# Two binaries (the app and bambumate-doctor): tells `cargo tauri` which one is the app.
default-run = "bambumate-tauri"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
walkdir = "2.5"
tempfile = "3.24"
scraper = "0.18"
html2text = "0.16"
texting_robots = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "macros", "rt-multi-thread", "net", "fs"] }
rand = "0.9"
urlencoding = "2.1"
regex = "1"
toml = "0.8"
image = "0.25"
base64 = "0.22"
notify = "7"
async-trait = "0.1"
rmcp = { version = "3.4.1", default-features = false, features = ["server", "transport-streamable-http-server", "base64"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
# Printer live connection (read-only MQTT over TLS to the printer on the LAN).
# rustls uses the ring provider explicitly: aws-lc-rs needs cmake/NASM on Windows.
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-parser = "0.18.1"
# Printer certificate fingerprints and slice cache keys.
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
# Slicing with Bambu Studio: read the output .gcode.3mf (a ZIP) and its XML metadata.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"

[target.'cfg(unix)'.dependencies]
# killpg: stop the slicer's whole process group on cancel or timeout.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
md5 = "0.7"

[dev-dependencies]
# Paused clock for tests of long timeouts.
tokio = { version = "1", features = ["test-util"] }
# In-process TLS MQTT broker and test certificates for printer::client/tls tests.
rcgen = "0.14.10"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
bytes = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Private build only: lets the Claude lane use the local CLI login instead of an API key.
# Never enable this in .github/workflows/build.yml.
claude-subscription = []
